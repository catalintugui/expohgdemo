name: Deploy to Hostico

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hostico-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: expohgdemo

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: expohgdemo/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build production
        run: npm run build:prd

      - name: Deploy dist to public_html
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./expohgdemo/dist/
          # FTP account Directory must be public_html (login root = site root)
          server-dir: ./
          exclude: |
            **/.DS_Store
            **/Archive.zip
