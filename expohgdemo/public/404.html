<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex, follow" />
    <title>404 — Arhiva Digitală Haralamb Georgescu</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #ebe8e1;
        --ink: #1a1a1a;
        --ink-muted: #5c5a55;
        --line: #1a1a1a;
        --bauhaus-red: #b83232;
        --bauhaus-blue: #1e3d6e;
        --bauhaus-yellow: #c9a227;
        --font: 'Jost', system-ui, sans-serif;
        --max-width: 68rem;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
      }

      body {
        display: flex;
        flex-direction: column;
        font-family: var(--font);
        font-weight: 300;
        font-size: 0.8125rem;
        line-height: 1.55;
        letter-spacing: 0.01em;
        color: var(--ink-muted);
        background: var(--bg);
        -webkit-font-smoothing: antialiased;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      a:hover {
        color: var(--ink);
      }

      .container {
        width: 100%;
        max-width: var(--max-width);
        margin: 0 auto;
        padding-inline: max(0.75rem, env(safe-area-inset-left, 0px))
          max(0.75rem, env(safe-area-inset-right, 0px));
      }

      @media (min-width: 30rem) {
        .container {
          padding-inline: 1.25rem;
        }
      }

      @media (min-width: 48rem) {
        .container {
          padding-inline: 2rem;
        }
      }

      .header {
        flex-shrink: 0;
        border-bottom: 1px solid var(--line);
        background: var(--bg);
        padding-top: env(safe-area-inset-top, 0px);
      }

      .header__inner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1.25rem;
        padding-block: 0.75rem;
      }

      @media (min-width: 48rem) {
        .header__inner {
          padding-block: 1.25rem;
        }
      }

      .header__title h1 {
        margin: 0;
        font-size: 1.125rem;
        font-weight: 400;
        line-height: 1.3;
        letter-spacing: 0.02em;
        text-transform: uppercase;
        color: var(--ink);
      }

      .header__tagline {
        flex-shrink: 0;
        font-size: 1.125rem;
        font-weight: 400;
        line-height: 1.3;
        text-transform: uppercase;
        letter-spacing: 0.02em;
        color: var(--ink);
        white-space: nowrap;
      }

      .main {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding-block: 2rem;
        min-height: 0;
      }

      .error {
        text-align: center;
        max-width: 28rem;
      }

      .error__code {
        margin: 0 0 0.75rem;
        font-size: clamp(3rem, 12vw, 5rem);
        font-weight: 300;
        line-height: 1;
        letter-spacing: 0.08em;
        color: var(--ink);
      }

      .error__title {
        margin: 0 0 1.5rem;
        font-size: 0.75rem;
        font-weight: 400;
        text-transform: uppercase;
        letter-spacing: 0.16em;
        color: var(--ink);
      }

      .error__text {
        margin: 0 0 1.75rem;
        font-size: 0.9375rem;
        font-weight: 300;
        color: var(--ink-muted);
      }

      .error__link {
        display: inline-block;
        font-size: 0.75rem;
        font-weight: 400;
        text-transform: uppercase;
        letter-spacing: 0.14em;
        color: var(--ink);
        border-bottom: 1px solid var(--ink);
        padding-bottom: 0.2rem;
      }

      .error__link:hover {
        color: var(--ink-muted);
        border-bottom-color: var(--ink-muted);
      }

      .footer {
        flex-shrink: 0;
        border-top: 1px solid var(--line);
        background: var(--bg);
        padding-block: 0.75rem;
        padding-bottom: max(0.75rem, env(safe-area-inset-bottom, 0px));
      }

      @media (min-width: 40rem) {
        .footer {
          padding-block: 1.25rem;
          padding-bottom: max(1.25rem, env(safe-area-inset-bottom, 0px));
        }
      }

      .footer__inner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
        font-size: 0.625rem;
        letter-spacing: 0.08em;
        color: var(--ink);
      }

      .footer__marks {
        display: grid;
        grid-template-columns: repeat(2, 6px);
        gap: 2px;
      }

      .footer__marks span {
        width: 6px;
        height: 6px;
      }

      .footer__marks span:nth-child(1) {
        background: var(--ink);
      }
      .footer__marks span:nth-child(2) {
        background: var(--bauhaus-red);
      }
      .footer__marks span:nth-child(3) {
        background: var(--bauhaus-blue);
      }
      .footer__marks span:nth-child(4) {
        background: var(--bauhaus-yellow);
      }

      .footer__meta {
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <header class="header">
      <div class="container header__inner">
        <a href="https://haralamb-georgescu.ro/" class="header__title">
          <h1>Arhiva Digitală</h1>
        </a>
        <span class="header__tagline">Haralamb Georgescu</span>
      </div>
    </header>

    <main class="main">
      <div class="error">
        <p class="error__code">404</p>
        <h2 class="error__title">Page not found</h2>
        <p class="error__text">Go to homepage</p>
        <a class="error__link" href="https://haralamb-georgescu.ro/">
          Homepage
        </a>
      </div>
    </main>

    <footer class="footer">
      <div class="container footer__inner">
        <div class="footer__marks" aria-hidden="true">
          <span></span>
          <span></span>
          <span></span>
          <span></span>
        </div>
        <span class="footer__meta">Haralamb Georgescu</span>
      </div>
    </footer>
  </body>
</html>
