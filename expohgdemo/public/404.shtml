<!DOCTYPE html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex, follow" />
    <meta name="theme-color" content="#1a1a1a" />
    <title>404 — Arhiva Digitală Haralamb Georgescu</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #ebe8e1;
        --ink: #1a1a1a;
        --ink-muted: #5c5a55;
        --line: #1a1a1a;
        --font: 'Jost', system-ui, sans-serif;
        --max-width: 68rem;
        --space-sm: 0.75rem;
        --space-md: 1.25rem;
        --space-lg: 2rem;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
      }

      body {
        display: flex;
        flex-direction: column;
        font-family: var(--font);
        font-weight: 300;
        font-size: 0.8125rem;
        letter-spacing: 0.01em;
        color: var(--ink-muted);
        background: var(--bg);
        -webkit-font-smoothing: antialiased;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      .container {
        width: 100%;
        max-width: var(--max-width);
        margin: 0 auto;
        padding-inline: max(var(--space-sm), env(safe-area-inset-left, 0px))
          max(var(--space-sm), env(safe-area-inset-right, 0px));
      }

      @media (min-width: 30rem) {
        .container {
          padding-inline: var(--space-md);
        }
      }

      @media (min-width: 48rem) {
        .container {
          padding-inline: var(--space-lg);
        }
      }

      .header {
        flex-shrink: 0;
        border-bottom: 1px solid var(--line);
        background: var(--bg);
        padding-top: env(safe-area-inset-top, 0px);
      }

      .header__inner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--space-md);
        padding-block: var(--space-sm);
      }

      @media (min-width: 48rem) {
        .header__inner {
          padding-block: var(--space-md);
        }
      }

      .header__title {
        min-width: 0;
        color: var(--ink);
      }

      .header__title h1 {
        margin: 0;
        font-size: 1.125rem;
        font-weight: 400;
        line-height: 1.3;
        text-transform: uppercase;
        letter-spacing: 0.02em;
        color: var(--ink);
      }

      .header__tagline {
        flex-shrink: 0;
        font-size: 1.125rem;
        font-weight: 400;
        line-height: 1.3;
        text-transform: uppercase;
        letter-spacing: 0.02em;
        color: var(--ink);
        white-space: nowrap;
      }

      .main {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding-block: var(--space-lg);
        min-height: 0;
      }

      .error {
        text-align: center;
        max-width: 28rem;
      }

      .error__code {
        margin: 0 0 var(--space-sm);
        font-size: clamp(2.5rem, 8vw, 4rem);
        font-weight: 400;
        line-height: 1;
        letter-spacing: 0.08em;
        color: var(--ink);
      }

      .error__text {
        margin: 0 0 var(--space-lg);
        font-size: 0.9375rem;
        font-weight: 300;
        line-height: 1.55;
        color: var(--ink-muted);
      }

      .error__link {
        display: inline-block;
        font-size: 0.75rem;
        font-weight: 400;
        text-transform: uppercase;
        letter-spacing: 0.16em;
        color: var(--ink);
        border-bottom: 1px solid var(--line);
        padding-bottom: 0.2rem;
      }

      .error__link:hover {
        color: var(--ink-muted);
        border-bottom-color: var(--ink-muted);
      }

      .footer {
        flex-shrink: 0;
        border-top: 1px solid var(--line);
        background: var(--bg);
        padding-block: var(--space-sm);
        padding-bottom: max(var(--space-sm), env(safe-area-inset-bottom, 0px));
      }

      .footer__inner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--space-sm);
        font-size: 0.625rem;
        letter-spacing: 0.08em;
        color: var(--ink);
      }

      @media (min-width: 40rem) {
        .footer {
          padding-block: var(--space-md);
          padding-bottom: max(var(--space-md), env(safe-area-inset-bottom, 0px));
        }
      }
    </style>
  </head>
  <body>
    <header class="header">
      <div class="container header__inner">
        <a href="https://haralamb-georgescu.ro/" class="header__title">
          <h1>Arhiva Digitală</h1>
        </a>
        <span class="header__tagline">Haralamb Georgescu</span>
      </div>
    </header>

    <main class="main">
      <div class="container error">
        <p class="error__code">404</p>
        <a class="error__link" href="https://haralamb-georgescu.ro/">
          Go to homepage
        </a>
      </div>
    </main>

    <footer class="footer">
      <div class="container footer__inner">
        <span>Haralamb Georgescu</span>
        <span>Bucureşti // România</span>
      </div>
    </footer>
  </body>
</html>
